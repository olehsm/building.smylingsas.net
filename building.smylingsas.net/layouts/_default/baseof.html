<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
    <head>
        {{ partial "html-document/head.html" . }}
    </head>
    <body>
        <div class="app-layout {{ if eq .Kind "page" }}single{{ end }}">
            <header class="header">
                {{ partial "layout/header.html" . }} 
            </header>
            <nav class="sidebar">
                {{ partial "layout/sidebar.html" . }}
            </nav>
            <main class="main">
                {{- block "main" . -}}{{- end -}}
            </main>
        </div>
        
        {{- partial "dialogs/search.html" . -}}
        {{- partial "html-document/scripts.html" . -}}
    </body>
</html>
