{{ define "main" }}
{{ $page := . }}
<div class="layout layout--article">
	<article>
		<section class="title hero">
			<div class="container">
				<h1 class="h1-list">
					{{.Title}}
				</h1>
				<p class="list-subtitle">{{.Params.subtitle}}</p>
			</div>
		</section>

		<section class="article-image">
			<div class="container">
				{{ partial "single/article-image.html" . }}
			</div>	
		</section>


	<section class="article-meta">
		<div class="container">
			{{ partial "single/article-meta.html" . }}
		</div>
	</section>

	<section class="article-content" data-pagefind-body>
		<div class="container">
			{{- .Content -}}
		</div>
	</section>
	</article>

	{{ partial "single/article-aside.html" . }}
</div>

	
	
	{{/*  <section class="table-of-contents">
		<div class="container">
			{{ .TableOfContents }}
		</div>
	</section>  */}}
	
	
</div>
{{ end }}
